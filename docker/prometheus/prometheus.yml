global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'jmall-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:10301']

  - job_name: 'jmall-agent'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['agent:18080']

  - job_name: 'jmall-bench'
    static_configs:
      - targets: ['bench:19090']

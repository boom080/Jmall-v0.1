server:
  port: 10301

spring:
  autoconfigure:
    exclude:
      - com.alibaba.cloud.seata.rest.SeataRestTemplateAutoConfiguration
      - com.alibaba.cloud.seata.web.SeataHandlerInterceptorConfiguration
      - com.alibaba.cloud.seata.GlobalTransactionAutoConfiguration
      - com.alibaba.cloud.seata.feign.SeataFeignClientAutoConfiguration
      - com.alibaba.cloud.seata.feign.hystrix.SeataHystrixAutoConfiguration
      - com.alibaba.cloud.sentinel.SentinelWebAutoConfiguration
      - com.alibaba.cloud.sentinel.SentinelWebFluxAutoConfiguration
      - com.alibaba.cloud.sentinel.endpoint.SentinelEndpointAutoConfiguration
      - com.alibaba.cloud.sentinel.custom.SentinelAutoConfiguration
      - com.alibaba.cloud.sentinel.feign.SentinelFeignAutoConfiguration
  devtools:
    livereload:
      enabled: false
    restart:
      enabled: false
  main:
    lazy-initialization: true
  sleuth:
    enabled: false
    async:
      enabled: false
  zipkin:
    enabled: false
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
    discovery:
      client:
        simple:
          instances:
            jrunmall-member:
              - uri: http://127.0.0.1:8000
            jrunmall-order:
              - uri: http://127.0.0.1:9000
  cache:
    type: simple
  session:
    store-type: none
  datasource:
    username: ${JRUNMALL_MYSQL_USERNAME:${GULIMALL_MYSQL_USERNAME:root}}
    password: ${JRUNMALL_MYSQL_PASSWORD:${GULIMALL_MYSQL_PASSWORD:123456}}
    url: jdbc:mysql://${JRUNMALL_MYSQL_HOST:${GULIMALL_MYSQL_HOST:127.0.0.1}}:${JRUNMALL_MYSQL_PORT:${GULIMALL_MYSQL_PORT:3306}}/jrunmall_pms?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    hikari:
      initialization-fail-timeout: 0

management:
  health:
    db:
      enabled: false
    redis:
      enabled: false

gulimall:
  seata:
    enabled: false
  redisson:
    enabled: false
  session:
    redis:
      enabled: false

jrunmall:
  oss:
    endpoint: ${JRUNMALL_OSS_ENDPOINT:${GULIMALL_OSS_ENDPOINT:}}
    region: ${JRUNMALL_OSS_REGION:${GULIMALL_OSS_REGION:}}
    bucket: ${JRUNMALL_OSS_BUCKET:${GULIMALL_OSS_BUCKET:}}
    access-key-id: ${JRUNMALL_OSS_ACCESS_KEY_ID:${GULIMALL_OSS_ACCESS_KEY_ID:}}
    access-key-secret: ${JRUNMALL_OSS_ACCESS_KEY_SECRET:${GULIMALL_OSS_ACCESS_KEY_SECRET:}}
    public-base-url: ${JRUNMALL_OSS_PUBLIC_BASE_URL:${GULIMALL_OSS_PUBLIC_BASE_URL:}}
    object-prefix: ${JRUNMALL_OSS_OBJECT_PREFIX:${GULIMALL_OSS_OBJECT_PREFIX:}}

jrunmall-member:
  ribbon:
    listOfServers: 127.0.0.1:8000

jrunmall-order:
  ribbon:
    listOfServers: 127.0.0.1:9000









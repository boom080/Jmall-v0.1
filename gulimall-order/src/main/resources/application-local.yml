server:
  port: ${JRUNMALL_ORDER_PORT:${GULIMALL_ORDER_PORT:9000}}

spring:
  autoconfigure:
    exclude:
      - com.alibaba.cloud.seata.rest.SeataRestTemplateAutoConfiguration
      - com.alibaba.cloud.seata.web.SeataHandlerInterceptorConfiguration
      - com.alibaba.cloud.seata.GlobalTransactionAutoConfiguration
      - com.alibaba.cloud.seata.feign.SeataFeignClientAutoConfiguration
      - com.alibaba.cloud.seata.feign.hystrix.SeataHystrixAutoConfiguration
      - com.alibaba.cloud.sentinel.SentinelWebAutoConfiguration
      - com.alibaba.cloud.sentinel.SentinelWebFluxAutoConfiguration
      - com.alibaba.cloud.sentinel.endpoint.SentinelEndpointAutoConfiguration
      - com.alibaba.cloud.sentinel.custom.SentinelAutoConfiguration
      - com.alibaba.cloud.sentinel.feign.SentinelFeignAutoConfiguration
  devtools:
    livereload:
      enabled: false
    restart:
      enabled: false
  datasource:
    username: ${JRUNMALL_MYSQL_USERNAME:${GULIMALL_MYSQL_USERNAME:root}}
    password: ${JRUNMALL_MYSQL_PASSWORD:${GULIMALL_MYSQL_PASSWORD:123456}}
    url: jdbc:mysql://${JRUNMALL_MYSQL_HOST:${GULIMALL_MYSQL_HOST:127.0.0.1}}:${JRUNMALL_MYSQL_PORT:${GULIMALL_MYSQL_PORT:3306}}/${JRUNMALL_ORDER_MYSQL_DATABASE:${GULIMALL_ORDER_MYSQL_DATABASE:jrunmall_commerce}}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${JRUNMALL_REDIS_HOST:${GULIMALL_REDIS_HOST:127.0.0.1}}
    port: ${JRUNMALL_REDIS_PORT:${GULIMALL_REDIS_PORT:6379}}
  rabbitmq:
    dynamic: false
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false
  session:
    store-type: none
  cloud:
    nacos:
      discovery:
        enabled: false
  zipkin:
    enabled: false
  sleuth:
    enabled: false

jrunmall:
  local-open-seckill-endpoints: true
  seckill:
    stream-name: ${JRUNMALL_SECKILL_STREAM:jrunmall:seckill:orders}
    consumer-group: ${JRUNMALL_SECKILL_CONSUMER_GROUP:jrunmall-order-group}
    consumer-name: ${JRUNMALL_SECKILL_CONSUMER_NAME:jrunmall-order-local}
    dead-letter-stream-name: ${JRUNMALL_SECKILL_DEAD_STREAM:jrunmall:seckill:orders:dead}
    retry-count-key-prefix: ${JRUNMALL_SECKILL_RETRY_PREFIX:jrunmall:seckill:retry}
    pending-idle-ms: ${JRUNMALL_SECKILL_PENDING_IDLE_MS:60000}
    max-retry-count: ${JRUNMALL_SECKILL_MAX_RETRY_COUNT:3}
    retry-interval-ms: ${JRUNMALL_SECKILL_RETRY_INTERVAL_MS:30000}









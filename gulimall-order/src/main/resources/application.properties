spring.thymeleaf.cache=false

jrunmall.thread.coreSize=20
jrunmall.thread.maxSize=200
jrunmall.thread.keepAliveTime=10

# RabbitMQ配置
spring.rabbitmq.host=${JRUNMALL_RABBITMQ_HOST:${GULIMALL_RABBITMQ_HOST:127.0.0.1}}
spring.rabbitmq.port=${JRUNMALL_RABBITMQ_PORT:${GULIMALL_RABBITMQ_PORT:5672}}
# 虚拟主机配置
spring.rabbitmq.virtual-host=/
# 开启发送端消息抵达Broker确认
spring.rabbitmq.publisher-confirms=true
# 开启发送端消息抵达Queue确认
spring.rabbitmq.publisher-returns=true
# 只要消息抵达Queue，就会异步发送优先回调returnfirm
spring.rabbitmq.template.mandatory=true
# 手动ack消息，不使用默认的消费端确认
spring.rabbitmq.listener.simple.acknowledge-mode=manual

#支付宝相关的配置
alipay.app_id=${JRUNMALL_ALIPAY_APP_ID:${GULIMALL_ALIPAY_APP_ID:__CHANGE_ME__}}
alipay.merchant_private_key=${JRUNMALL_ALIPAY_MERCHANT_PRIVATE_KEY:${GULIMALL_ALIPAY_MERCHANT_PRIVATE_KEY:__CHANGE_ME__}}
alipay.alipay_public_key=${JRUNMALL_ALIPAY_PUBLIC_KEY:${GULIMALL_ALIPAY_PUBLIC_KEY:__CHANGE_ME__}}
alipay.notify_url=${JRUNMALL_ALIPAY_NOTIFY_URL:${GULIMALL_ALIPAY_NOTIFY_URL:http://127.0.0.1:9000/payed/notify}}
alipay.return_url=${JRUNMALL_ALIPAY_RETURN_URL:${GULIMALL_ALIPAY_RETURN_URL:http://127.0.0.1:8000/memberOrder.html}}
alipay.sign_type=RSA2
alipay.charset=utf-8
alipay.gatewayUrl=https://openapi.alipaydev.com/gateway.do



#微信相关配置
wx.appId=${JRUNMALL_WECHAT_APP_ID:${GULIMALL_WECHAT_APP_ID:__CHANGE_ME__}}
wx.mchId=${JRUNMALL_WECHAT_MCH_ID:${GULIMALL_WECHAT_MCH_ID:__CHANGE_ME__}}
wx.mchKey=${JRUNMALL_WECHAT_MCH_KEY:${GULIMALL_WECHAT_MCH_KEY:__CHANGE_ME__}}
wx.notifyUrl=${JRUNMALL_WECHAT_NOTIFY_URL:${GULIMALL_WECHAT_NOTIFY_URL:http://127.0.0.1:9000/pay/notify}}
wx.returnUrl=${JRUNMALL_WECHAT_RETURN_URL:${GULIMALL_WECHAT_RETURN_URL:http://127.0.0.1:8000/memberOrder.html}}

spring.mvc.date-format=yyyy-MM-dd HH:mm:ss


#服务追踪
spring.zipkin.base-url=${JRUNMALL_ZIPKIN_BASE_URL:${GULIMALL_ZIPKIN_BASE_URL:http://127.0.0.1:9411/}}
#关闭服务发现
spring.zipkin.discovery-client-enabled=false
spring.zipkin.sender.type=web
#配置采样器
spring.sleuth.sampler.probability=1

spring.cloud.sentinel.transport.dashboard=${JRUNMALL_SENTINEL_DASHBOARD:${GULIMALL_SENTINEL_DASHBOARD:127.0.0.1:8858}}
spring.cloud.sentinel.transport.port=8719
management.endpoints.web.exposure.include=*

feign.sentinel.enabled=true

#全局配置
# 请求连接的超时时间 默认的时间为 1 秒
ribbon.ConnectTimeout=60000
# 请求处理的超时时间
ribbon.ReadTimeout=60000









.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;jmall-v03-concept&#x27;);
  if (!root) return;

  const toast = root.querySelector(&#x27;#jm-toast&#x27;);
  let toastTimer;
  const showToast = (message) =&gt; {
    toast.textContent = message;
    toast.classList.add(&#x27;is-visible&#x27;);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() =&gt; toast.classList.remove(&#x27;is-visible&#x27;), 1600);
  };

  const runSearch = () =&gt; {
    const value = root.querySelector(&#x27;#jm-search-input&#x27;).value.trim();
    showToast(value ? `正在寻找「${value}」` : &#x27;输入想找的好物吧 ✨&#x27;);
  };
  root.querySelector(&#x27;#jm-search-button&#x27;).addEventListener(&#x27;click&#x27;, runSearch);
  root.querySelector(&#x27;#jm-search-input&#x27;).addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
    if (event.key !== &#x27;Enter&#x27;) return;
    event.preventDefault();
    runSearch();
  });

  root.querySelectorAll(&#x27;.jm-hotwords button&#x27;).forEach((button) =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; {
      root.querySelector(&#x27;#jm-search-input&#x27;).value = button.textContent;
      showToast(`已填入「${button.textContent}」`);
    });
  });

  const filters = root.querySelectorAll(&#x27;.jm-filter&#x27;);
  const products = root.querySelectorAll(&#x27;.jm-product&#x27;);
  filters.forEach((button) =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; {
      filters.forEach((item) =&gt; {
        item.classList.toggle(&#x27;is-selected&#x27;, item === button);
        item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button));
      });
      const target = button.dataset.filter;
      let visible = 0;
      products.forEach((product) =&gt; {
        const groups = product.dataset.groups.split(&#x27; &#x27;);
        const show = target === &#x27;all&#x27; || groups.includes(target);
        product.hidden = !show;
        if (show) visible += 1;
      });
      root.querySelector(&#x27;#jm-result-count&#x27;).textContent = String(visible);
    });
  });

  root.querySelectorAll(&#x27;.jm-heart&#x27;).forEach((button) =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; {
      const selected = button.getAttribute(&#x27;aria-pressed&#x27;) !== &#x27;true&#x27;;
      button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
      button.textContent = selected ? &#x27;♥&#x27; : &#x27;♡&#x27;;
      showToast(selected ? &#x27;已放进心愿收藏 💖&#x27; : &#x27;已取消收藏&#x27;);
    });
  });

  let missionCount = 2;
  const missionFill = root.querySelector(&#x27;#jm-mission-fill&#x27;);
  const missionCounter = root.querySelector(&#x27;#jm-mission-count&#x27;);
  const rewardButton = root.querySelector(&#x27;#jm-reward-button&#x27;);
  const missionTrack = root.querySelector(&#x27;.jm-mission-track&#x27;);
  root.querySelectorAll(&#x27;.jm-visit&#x27;).forEach((button) =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; {
      if (missionCount &lt; 3) {
        missionCount += 1;
        missionFill.style.width = `${(missionCount / 3) * 100}%`;
        missionCounter.textContent = `${missionCount}/3`;
        missionTrack.setAttribute(&#x27;aria-valuenow&#x27;, String(missionCount));
        rewardButton.disabled = false;
        rewardButton.textContent = &#x27;领取奖励&#x27;;
        showToast(&#x27;今日任务完成，金币奖励已解锁！&#x27;);
      } else {
        showToast(&#x27;正在打开这件好物 ✨&#x27;);
      }
    });
  });

  rewardButton.addEventListener(&#x27;click&#x27;, () =&gt; {
    if (rewardButton.disabled) return;
    rewardButton.disabled = true;
    rewardButton.textContent = &#x27;已领取 ✓&#x27;;
    showToast(&#x27;+50 金币，离升级又近一步！&#x27;);
  });

  const helper = root.querySelector(&#x27;#jm-ai-helper&#x27;);
  const bubble = root.querySelector(&#x27;#jm-ai-bubble&#x27;);
  helper.addEventListener(&#x27;click&#x27;, () =&gt; {
    const opening = bubble.hidden;
    bubble.hidden = !opening;
    helper.setAttribute(&#x27;aria-expanded&#x27;, String(opening));
  });
})();

  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  --mk-surface: light-dark(#fffefd, #352a42);
  --mk-soft: light-dark(#fff0df, #42344d);
  --mk-text: light-dark(#342b4a, #fff8ef);
  --mk-muted: light-dark(#84798c, #cabdd0);
  --mk-line: light-dark(#eedfd2, #55445f);
  --mk-pink: light-dark(#ff6b81, #ff8295);
  --mk-red: light-dark(#ff4d63, #ff687d);
  --mk-rose: light-dark(#c65776, #e27190);
  --mk-purple: light-dark(#8b7cf6, #aa9dff);
  --mk-yellow: light-dark(#ffd75e, #f5cc51);
  --mk-mint: light-dark(#6bd0ae, #79d8b8);
  --mk-shadow: light-dark(rgba(91,63,72,.14), rgba(0,0,0,.28));
  position: relative;
  width: 100%;
  overflow: hidden;
  border-radius: 24px;
  color: var(--mk-text);
  background: radial-gradient(circle at 93% 2%, color-mix(in srgb, var(--mk-yellow) 22%, transparent), transparent 17%), var(--mk-page);
  font-family: ui-rounded, &quot;SF Pro Rounded&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;
}
#jm-mascot-kit * { box-sizing: border-box; }
#jm-mascot-kit button { font: inherit; color: inherit; }
#jm-mascot-kit .mk-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 16px 24px; border-bottom: 1px solid var(--mk-line); background: color-mix(in srgb, var(--mk-surface) 95%, transparent); }
#jm-mascot-kit .mk-brand { display: flex; align-items: center; gap: 10px; }
#jm-mascot-kit .mk-brand &gt; div:last-child { display: grid; gap: 1px; }
#jm-mascot-kit .mk-brand strong { font-size: 23px; font-weight: 500; letter-spacing: -.6px; }
#jm-mascot-kit .mk-brand &gt; div &gt; span { color: var(--mk-muted); font-size: 11px; }
#jm-mascot-kit .mk-version { padding: 7px 10px; border: 1px solid color-mix(in srgb, var(--mk-pink) 34%, var(--mk-line)); border-radius: 99px; color: var(--mk-red); background: color-mix(in srgb, var(--mk-pink) 8%, var(--mk-surface)); font-size: 10px; letter-spacing: 1px; }
#jm-mascot-kit .mk-tabs { display: flex; gap: 6px; padding: 18px 24px 0; overflow-x: auto; }
#jm-mascot-kit .mk-tabs button { min-height: 40px; padding: 0 14px; border: 1px solid var(--mk-line); border-radius: 12px; background: var(--mk-surface); cursor: pointer; white-space: nowrap; }
#jm-mascot-kit .mk-tabs button.is-active { color: #fff; border-color: var(--mk-red); background: var(--mk-red); box-shadow: 0 8px 18px color-mix(in srgb, var(--mk-red) 25%, transparent); }
#jm-mascot-kit .mk-panel { padding: 24px; }
#jm-mascot-kit .mk-panel[hidden] { display: none; }
#jm-mascot-kit .mk-section-copy { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
#jm-mascot-kit .mk-section-copy h2 { margin: 3px 0 0; font-size: 30px; line-height: 1.2; font-weight: 500; }
#jm-mascot-kit .mk-section-copy p { max-width: 430px; margin: 0; color: var(--mk-muted); font-size: 13px; line-height: 1.65; }
#jm-mascot-kit .mk-kicker { color: var(--mk-pink); font-size: 10px; letter-spacing: 1.6px; }
#jm-mascot-kit .mk-pose-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
#jm-mascot-kit .mk-pose { min-width: 0; padding: 18px 10px 15px; text-align: center; border: 1px solid var(--mk-line); border-radius: 20px; background: var(--mk-surface); box-shadow: 0 12px 26px var(--mk-shadow); }
#jm-mascot-kit .mk-pose strong { display: block; margin-top: 11px; font-size: 13px; font-weight: 500; }
#jm-mascot-kit .mk-pose &gt; span { display: block; margin-top: 3px; color: var(--mk-muted); font-size: 10px; }
#jm-mascot-kit .mk-lock-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
#jm-mascot-kit .mk-lock-row span { padding: 7px 10px; border-radius: 99px; color: var(--mk-muted); background: color-mix(in srgb, var(--mk-purple) 8%, var(--mk-surface)); font-size: 10px; }

#jm-mascot-kit .mk-mascot { position: relative; display: grid; place-items: center; min-height: 150px; }
#jm-mascot-kit .mk-bag,
#jm-mascot-kit .mk-mark { position: relative; width: 112px; height: 105px; border-radius: 24px 24px 32px 32px; background: linear-gradient(150deg, var(--mk-pink), var(--mk-red)); box-shadow: 0 14px 22px color-mix(in srgb, var(--mk-red) 25%, transparent); }
#jm-mascot-kit .mk-handle { position: absolute; left: 27px; top: -35px; width: 58px; height: 42px; border: 10px solid var(--mk-rose); border-bottom: 0; border-radius: 32px 32px 0 0; }
#jm-mascot-kit .mk-eye { position: absolute; top: 40px; width: 9px; height: 14px; border-radius: 50%; background: #342b4a; }
#jm-mascot-kit .mk-eye.mk-left { left: 35px; }
#jm-mascot-kit .mk-eye.mk-right { right: 35px; }
#jm-mascot-kit .mk-smile { position: absolute; left: 48px; top: 61px; width: 17px; height: 9px; border-bottom: 3px solid #342b4a; border-radius: 50%; }
#jm-mascot-kit .mk-blush { position: absolute; top: 59px; width: 16px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.35); }
#jm-mascot-kit .mk-blush-left { left: 16px; }
#jm-mascot-kit .mk-blush-right { right: 16px; }
#jm-mascot-kit .mk-star { position: absolute; right: 9px; bottom: 7px; color: var(--mk-yellow); font-size: 24px; transform: rotate(10deg); }
#jm-mascot-kit .mk-arm { position: absolute; z-index: -1; top: 50px; width: 28px; height: 45px; border-radius: 20px; background: var(--mk-pink); }
#jm-mascot-kit .mk-arm-left { left: -18px; transform: rotate(32deg); }
#jm-mascot-kit .mk-arm-right { right: -18px; transform: rotate(-40deg); }
#jm-mascot-kit .mk-wave .mk-arm-right { top: 16px; transform: rotate(-145deg); transform-origin: bottom; }
#jm-mascot-kit .mk-think .mk-bag { transform: rotate(-4deg); }
#jm-mascot-kit .mk-thought { position: absolute; right: 15px; top: 6px; z-index: 2; padding: 5px 9px; border-radius: 12px 12px 12px 3px; color: var(--mk-purple); background: var(--mk-surface); box-shadow: 0 7px 16px var(--mk-shadow); }
#jm-mascot-kit .mk-cheer .mk-bag { transform: translateY(-5px) rotate(5deg); }
#jm-mascot-kit .mk-happy-eye { height: 8px; border-radius: 10px 10px 0 0; background: transparent; border-top: 3px solid #342b4a; }
#jm-mascot-kit .mk-open-smile { height: 15px; border: 0; border-radius: 4px 4px 12px 12px; background: #342b4a; }
#jm-mascot-kit .mk-spark { position: absolute; z-index: 3; color: var(--mk-yellow); }
#jm-mascot-kit .mk-spark-a { left: 17px; top: 20px; font-size: 22px; }
#jm-mascot-kit .mk-spark-b { right: 14px; bottom: 20px; color: var(--mk-mint); font-size: 15px; }
#jm-mascot-kit .mk-mark-mini { width: 38px; height: 36px; border-radius: 9px 9px 12px 12px; box-shadow: none; }
#jm-mascot-kit .mk-mark-mini .mk-handle { left: 9px; top: -10px; width: 20px; height: 14px; border-width: 4px; }
#jm-mascot-kit .mk-mark-mini .mk-eye { top: 14px; width: 3px; height: 5px; }
#jm-mascot-kit .mk-mark-mini .mk-eye.mk-left { left: 12px; }
#jm-mascot-kit .mk-mark-mini .mk-eye.mk-right { right: 12px; }
#jm-mascot-kit .mk-mark-mini .mk-smile { left: 16px; top: 21px; width: 6px; height: 4px; border-width: 1px; }
#jm-mascot-kit .mk-mark-mini .mk-blush { display: none; }
#jm-mascot-kit .mk-mark-mini .mk-star { right: 2px; bottom: 1px; font-size: 8px; }

#jm-mascot-kit .mk-reward-stage { position: relative; display: grid; place-items: center; min-height: 370px; overflow: hidden; border-radius: 24px; background: radial-gradient(circle at center, color-mix(in srgb, var(--mk-yellow) 34%, transparent), transparent 39%), linear-gradient(135deg, light-dark(#3d3155, #271f35), light-dark(#2f4851, #26373c)); }
#jm-mascot-kit .mk-reward-stage::before { content: &quot;&quot;; position: absolute; inset: 0; background: radial-gradient(circle at 20% 20%, rgba(255,255,255,.18) 0 2px, transparent 3px), radial-gradient(circle at 76% 30%, rgba(255,255,255,.13) 0 3px, transparent 4px); }
#jm-mascot-kit .mk-reward-mascot { z-index: 2; min-height: 0; transform: scale(1.25); }
#jm-mascot-kit .mk-reward-copy { position: absolute; bottom: 27px; z-index: 3; display: grid; gap: 3px; text-align: center; color: #fff; }
#jm-mascot-kit .mk-reward-copy span { font-size: 11px; opacity: .76; }
#jm-mascot-kit .mk-reward-copy strong { color: var(--mk-yellow); font-size: 24px; font-weight: 500; }
#jm-mascot-kit .mk-coin { position: absolute; left: 50%; top: 50%; z-index: 4; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: #fff0a2; background: #efa91c; box-shadow: inset 0 0 0 4px #ffd75e, 0 8px 16px rgba(0,0,0,.15); opacity: 0; }
#jm-mascot-kit .mk-reward-glow { position: absolute; width: 160px; height: 160px; border-radius: 50%; background: var(--mk-yellow); filter: blur(35px); opacity: .16; }
#jm-mascot-kit .mk-reward-stage.is-playing .mk-reward-mascot { animation: mk-jump 1.8s ease both; }
#jm-mascot-kit .mk-reward-stage.is-playing .mk-coin { animation: mk-burst 1.15s .55s ease-out both; }
#jm-mascot-kit .mk-reward-stage.is-playing .mk-coin-two { --x: 90px; --y: -115px; animation-delay: .62s; }
#jm-mascot-kit .mk-reward-stage.is-playing .mk-coin-one { --x: -100px; --y: -90px; }
#jm-mascot-kit .mk-reward-stage.is-playing .mk-coin-three { --x: -115px; --y: 15px; animation-delay: .68s; }
#jm-mascot-kit .mk-reward-stage.is-playing .mk-coin-four { --x: 112px; --y: 18px; animation-delay: .72s; }
#jm-mascot-kit .mk-actions { display: flex; align-items: center; gap: 14px; margin-top: 14px; color: var(--mk-muted); font-size: 11px; }
#jm-mascot-kit .mk-primary { min-height: 42px; padding: 0 16px; border: 0; border-radius: 13px; color: #fff !important; background: var(--mk-red); cursor: pointer; font-weight: 500; }

#jm-mascot-kit .mk-loading-layout { display: grid; grid-template-columns: minmax(0,1.7fr) minmax(240px,.8fr); gap: 16px; }
#jm-mascot-kit .mk-loading-stage { position: relative; display: grid; grid-template-columns: 210px minmax(0,1fr); align-items: center; min-height: 340px; padding: 32px; overflow: hidden; border-radius: 24px; background: linear-gradient(135deg, light-dark(#ffe7df, #493344), light-dark(#f0e8ff, #3d355c)); }
#jm-mascot-kit .mk-loader { z-index: 2; min-height: 180px; }
#jm-mascot-kit .mk-loader .mk-bag { transform: scale(1.18); }
#jm-mascot-kit .mk-orbit { position: absolute; left: 48px; top: 57px; width: 148px; height: 148px; border: 1px dashed color-mix(in srgb, var(--mk-purple) 45%, transparent); border-radius: 50%; animation: mk-spin 5s linear infinite; }
#jm-mascot-kit .mk-orbit i { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--mk-yellow); }
#jm-mascot-kit .mk-orbit i:nth-child(1) { left: 18px; top: 10px; }
#jm-mascot-kit .mk-orbit i:nth-child(2) { right: -3px; top: 64px; background: var(--mk-mint); }
#jm-mascot-kit .mk-orbit i:nth-child(3) { left: 42px; bottom: -2px; background: var(--mk-pink); }
#jm-mascot-kit .mk-prop { position: absolute; left: 138px; top: 122px; z-index: 4; display: grid; place-items: center; width: 56px; height: 56px; border-radius: 18px; color: #fff; background: var(--mk-purple); box-shadow: 0 10px 20px color-mix(in srgb, var(--mk-purple) 28%, transparent); font-size: 30px; transform: rotate(-8deg); }
#jm-mascot-kit .mk-loading-copy { display: grid; gap: 7px; }
#jm-mascot-kit .mk-loading-copy strong { font-size: 24px; font-weight: 500; }
#jm-mascot-kit .mk-loading-copy span { color: var(--mk-muted); font-size: 12px; }
#jm-mascot-kit .mk-loading-copy small { color: var(--mk-muted); font-size: 10px; }
#jm-mascot-kit .mk-progress { height: 8px; margin: 10px 0 1px; overflow: hidden; border-radius: 99px; background: color-mix(in srgb, var(--mk-surface) 54%, transparent); }
#jm-mascot-kit .mk-progress i { display: block; width: 62%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--mk-pink), var(--mk-purple)); transition: width .35s ease; }
#jm-mascot-kit .mk-state-list { display: grid; align-content: start; gap: 9px; }
#jm-mascot-kit .mk-state-list button { display: grid; grid-template-columns: 34px 1fr; align-items: center; gap: 10px; min-height: 78px; padding: 12px; text-align: left; border: 1px solid var(--mk-line); border-radius: 17px; background: var(--mk-surface); cursor: pointer; }
#jm-mascot-kit .mk-state-list button.is-active { border-color: color-mix(in srgb, var(--mk-purple) 58%, var(--mk-line)); background: color-mix(in srgb, var(--mk-purple) 8%, var(--mk-surface)); }
#jm-mascot-kit .mk-state-list button &gt; span { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; color: var(--mk-purple); background: color-mix(in srgb, var(--mk-purple) 12%, var(--mk-surface)); font-size: 10px; }
#jm-mascot-kit .mk-state-list button div { display: grid; gap: 3px; }
#jm-mascot-kit .mk-state-list strong { font-size: 12px; font-weight: 500; }
#jm-mascot-kit .mk-state-list small { color: var(--mk-muted); font-size: 10px; }

#jm-mascot-kit .mk-game-layout { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(250px,.75fr); gap: 16px; }
#jm-mascot-kit .mk-game { position: relative; min-height: 390px; overflow: hidden; border-radius: 24px; background: linear-gradient(#c9f0f4 0 58%, #bfe1b1 58% 66%, #e9d6a8 66%); border: 1px solid var(--mk-line); }
#jm-mascot-kit .mk-game::before { content: &quot;&quot;; position: absolute; left: 8%; top: 15%; width: 92px; height: 36px; border-radius: 50px; background: rgba(255,255,255,.56); box-shadow: 230px 48px 0 rgba(255,255,255,.4); }
#jm-mascot-kit .mk-game-sky { position: absolute; inset: 16px 20px auto; display: flex; justify-content: space-between; color: rgba(255,255,255,.8); }
#jm-mascot-kit .mk-game-hud { position: absolute; inset: 14px 14px auto; z-index: 5; display: flex; justify-content: space-between; gap: 12px; padding: 9px 11px; border-radius: 13px; background: rgba(255,255,255,.82); color: #342b4a; backdrop-filter: blur(8px); font-size: 11px; }
#jm-mascot-kit .mk-game-hud strong { font-weight: 500; }
#jm-mascot-kit .mk-game-mascot { position: absolute; left: calc(50% - 48px); bottom: 22px; z-index: 4; width: 96px; transition: left .12s ease; }
#jm-mascot-kit .mk-game-mascot .mk-mark { width: 96px; height: 90px; }
#jm-mascot-kit .mk-game-mascot .mk-handle { left: 23px; }
#jm-mascot-kit .mk-game-mascot .mk-eye { top: 34px; }
#jm-mascot-kit .mk-game-mascot .mk-eye.mk-left { left: 30px; }
#jm-mascot-kit .mk-game-mascot .mk-eye.mk-right { right: 30px; }
#jm-mascot-kit .mk-game-mascot .mk-smile { left: 40px; top: 53px; }
#jm-mascot-kit .mk-falling { position: absolute; left: 50%; top: 60px; z-index: 3; font-size: 34px; transform: translateX(-50%); }
#jm-mascot-kit .mk-game-side { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 26px; border: 1px solid var(--mk-line); border-radius: 24px; background: var(--mk-surface); }
#jm-mascot-kit .mk-game-side h3 { margin: 12px 0 6px; font-size: 24px; font-weight: 500; }
#jm-mascot-kit .mk-game-side p { margin: 0; color: var(--mk-muted); font-size: 12px; line-height: 1.7; }
#jm-mascot-kit .mk-game-badge { padding: 6px 9px; border-radius: 99px; color: var(--mk-purple); background: color-mix(in srgb, var(--mk-purple) 10%, var(--mk-surface)); font-size: 10px; }
#jm-mascot-kit .mk-game-controls { display: grid; grid-template-columns: 46px minmax(84px,1fr) 46px; gap: 7px; width: 100%; margin-top: 18px; }
#jm-mascot-kit .mk-game-controls button { min-height: 44px; border: 1px solid var(--mk-line); border-radius: 13px; background: var(--mk-soft); cursor: pointer; }
#jm-mascot-kit .mk-game-controls .mk-primary { border: 0; background: var(--mk-red); }
#jm-mascot-kit .mk-skip { margin-top: 10px; padding: 5px 0; border: 0; color: var(--mk-muted); background: transparent; cursor: pointer; font-size: 10px; }
#jm-mascot-kit .mk-toast { position: absolute; left: 50%; bottom: 18px; z-index: 20; padding: 9px 12px; border-radius: 11px; color: var(--mk-text); background: var(--mk-surface); box-shadow: 0 10px 24px var(--mk-shadow); opacity: 0; transform: translate(-50%,12px); pointer-events: none; transition: .2s ease; font-size: 11px; }
#jm-mascot-kit .mk-toast.is-visible { opacity: 1; transform: translate(-50%,0); }

@keyframes mk-jump { 0%,100% { transform: translateY(0) scale(1.25); } 18% { transform: translateY(7px) scale(1.34,.98); } 48% { transform: translateY(-55px) rotate(7deg) scale(1.25); } 68% { transform: translateY(-34px) rotate(-4deg) scale(1.25); } 88% { transform: translateY(5px) scale(1.33,.98); } }
@keyframes mk-burst { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.4); } 35% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(160deg) scale(1); } }
@keyframes mk-spin { to { transform: rotate(360deg); } }

@media (max-width: 760px) {
  #jm-mascot-kit .mk-pose-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  #jm-mascot-kit .mk-loading-layout,
  #jm-mascot-kit .mk-game-layout { grid-template-columns: 1fr; }
  #jm-mascot-kit .mk-state-list { grid-template-columns: repeat(3,minmax(0,1fr)); }
  #jm-mascot-kit .mk-state-list button { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  #jm-mascot-kit { border-radius: 16px; }
  #jm-mascot-kit .mk-head { padding: 13px 14px; }
  #jm-mascot-kit .mk-version { display: none; }
  #jm-mascot-kit .mk-tabs { padding: 13px 12px 0; }
  #jm-mascot-kit .mk-panel { padding: 18px 12px 24px; }
  #jm-mascot-kit .mk-section-copy { display: block; }
  #jm-mascot-kit .mk-section-copy h2 { font-size: 24px; }
  #jm-mascot-kit .mk-section-copy p { margin-top: 9px; }
  #jm-mascot-kit .mk-pose-grid { grid-template-columns: 1fr; }
  #jm-mascot-kit .mk-pose-grid .mk-pose:nth-child(n+3) { display: none; }
  #jm-mascot-kit .mk-loading-stage { grid-template-columns: 1fr; padding: 24px 16px; text-align: center; }
  #jm-mascot-kit .mk-orbit { left: calc(50% - 74px); top: 34px; }
  #jm-mascot-kit .mk-prop { left: calc(50% + 20px); top: 100px; }
  #jm-mascot-kit .mk-state-list { grid-template-columns: 1fr; }
  #jm-mascot-kit .mk-state-list button { grid-template-columns: 34px 1fr; }
  #jm-mascot-kit .mk-actions { align-items: flex-start; flex-direction: column; }
  #jm-mascot-kit .mk-reward-stage { min-height: 330px; }
}
@media (prefers-reduced-motion: reduce) {
  #jm-mascot-kit .mk-orbit { animation: none; }
  #jm-mascot-kit .mk-reward-stage.is-playing .mk-reward-mascot,
  #jm-mascot-kit .mk-reward-stage.is-playing .mk-coin { animation: none; }
  #jm-mascot-kit .mk-game-mascot,
  #jm-mascot-kit .mk-toast { transition: none; }
}
&lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;jm-mascot-kit&#x27;);
  if (!root) return;
  const tabs = [...root.querySelectorAll(&#x27;[data-panel]&#x27;)];
  const panels = [...root.querySelectorAll(&#x27;[data-panel-view]&#x27;)];
  tabs.forEach((tab) =&gt; tab.addEventListener(&#x27;click&#x27;, () =&gt; {
    tabs.forEach((item) =&gt; item.classList.toggle(&#x27;is-active&#x27;, item === tab));
    panels.forEach((panel) =&gt; {
      const active = panel.dataset.panelView === tab.dataset.panel;
      panel.hidden = !active;
      panel.classList.toggle(&#x27;is-active&#x27;, active);
    });
  }));

  const toast = root.querySelector(&#x27;#mk-toast&#x27;);
  let toastTimer;
  const showToast = (message) =&gt; {
    toast.textContent = message;
    toast.classList.add(&#x27;is-visible&#x27;);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() =&gt; toast.classList.remove(&#x27;is-visible&#x27;), 1800);
  };

  const rewardStage = root.querySelector(&#x27;#mk-reward-stage&#x27;);
  root.querySelector(&#x27;#mk-play-reward&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    rewardStage.classList.remove(&#x27;is-playing&#x27;);
    void rewardStage.offsetWidth;
    rewardStage.classList.add(&#x27;is-playing&#x27;);
    setTimeout(() =&gt; showToast(&#x27;奖励已收入金币袋 ✦&#x27;), 1180);
  });

  const loadingStates = {
    ai: { prop: &#x27;⌕&#x27;, title: &#x27;正在理解你的商品&#x27;, subtitle: &#x27;整理受众、卖点与使用场景…&#x27;, time: &#x27;预计还需 8 秒&#x27;, progress: &#x27;62%&#x27; },
    image: { prop: &#x27;▧&#x27;, title: &#x27;正在为商品寻找参考图&#x27;, subtitle: &#x27;根据完善后的商品信息筛选相似图片…&#x27;, time: &#x27;正在检查来源与清晰度&#x27;, progress: &#x27;78%&#x27; },
    publish: { prop: &#x27;📦&#x27;, title: &#x27;正在把商品送上货架&#x27;, subtitle: &#x27;保存平台文案、图片与价格设置…&#x27;, time: &#x27;马上就好&#x27;, progress: &#x27;91%&#x27; }
  };
  root.querySelectorAll(&#x27;[data-loading]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
    root.querySelectorAll(&#x27;[data-loading]&#x27;).forEach((item) =&gt; item.classList.toggle(&#x27;is-active&#x27;, item === button));
    const state = loadingStates[button.dataset.loading];
    root.querySelector(&#x27;#mk-load-prop&#x27;).textContent = state.prop;
    root.querySelector(&#x27;#mk-load-title&#x27;).textContent = state.title;
    root.querySelector(&#x27;#mk-load-subtitle&#x27;).textContent = state.subtitle;
    root.querySelector(&#x27;#mk-load-time&#x27;).textContent = state.time;
    root.querySelector(&#x27;#mk-load-progress&#x27;).style.width = state.progress;
  }));

  const game = root.querySelector(&#x27;#mk-game&#x27;);
  const mascot = root.querySelector(&#x27;#mk-game-mascot&#x27;);
  const falling = root.querySelector(&#x27;#mk-falling&#x27;);
  const scoreEl = root.querySelector(&#x27;#mk-score&#x27;);
  const statusEl = root.querySelector(&#x27;#mk-game-status&#x27;);
  let x = 50;
  let y = 60;
  let dropX = 50;
  let score = 0;
  let running = false;
  let startedAt = 0;
  let lastFrame = 0;
  const pickups = [{ icon: &#x27;🪙&#x27;, points: 10 }, { icon: &#x27;📦&#x27;, points: 20 }, { icon: &#x27;⭐&#x27;, points: 15 }, { icon: &#x27;❔&#x27;, points: -10 }];
  let pickup = pickups[0];
  const move = (delta) =&gt; { x = Math.max(10, Math.min(90, x + delta)); mascot.style.left = `calc(${x}% - 48px)`; };
  root.querySelector(&#x27;#mk-left&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; move(-14));
  root.querySelector(&#x27;#mk-right&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; move(14));
  root.addEventListener(&#x27;keydown&#x27;, (event) =&gt; { if (event.key === &#x27;ArrowLeft&#x27;) move(-10); if (event.key === &#x27;ArrowRight&#x27;) move(10); });
  const resetDrop = () =&gt; {
    y = 58;
    dropX = 12 + Math.random() * 76;
    pickup = pickups[Math.floor(Math.random() * pickups.length)];
    falling.textContent = pickup.icon;
    falling.style.left = `${dropX}%`;
  };
  const frame = (time) =&gt; {
    if (!running) return;
    if (!lastFrame) lastFrame = time;
    const dt = Math.min(34, time - lastFrame);
    lastFrame = time;
    y += dt * .095;
    falling.style.top = `${y}px`;
    const remaining = Math.max(0, 20 - Math.floor((time - startedAt) / 1000));
    statusEl.textContent = `${remaining} 秒`;
    if (y &gt; game.clientHeight - 115) {
      if (Math.abs(dropX - x) &lt; 14) {
        score = Math.max(0, score + pickup.points);
        scoreEl.textContent = score;
      }
      resetDrop();
    }
    if (time - startedAt &gt;= 20000) {
      running = false;
      statusEl.textContent = &#x27;完成！&#x27;;
      showToast(`小游戏结束，获得 ${score} 好物积分`);
      return;
    }
    requestAnimationFrame(frame);
  };
  root.querySelector(&#x27;#mk-start-game&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    score = 0; scoreEl.textContent = &#x27;0&#x27;; running = true; startedAt = performance.now(); lastFrame = 0; resetDrop(); requestAnimationFrame(frame);
  });
  root.querySelector(&#x27;.mk-skip&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showToast(&#x27;已返回 AI 生成进度&#x27;));
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {

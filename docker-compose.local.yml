services:
  mysql:
    image: mysql:8.0
    container_name: jrunmall-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${JRUNMALL_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${JRUNMALL_MYSQL_BOOTSTRAP_DB:-jrunmall_pms}
      TZ: Asia/Shanghai
    ports:
      - "${JRUNMALL_MYSQL_PORT:-3306}:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - jrunmall_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

  postgres:
    image: pgvector/pgvector:pg16
    container_name: jrunmall-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${JRUNMALL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${JRUNMALL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${JRUNMALL_POSTGRES_DB:-jrunmall_ai}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "${JRUNMALL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - jrunmall_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: jrunmall-redis-local
    restart: unless-stopped
    ports:
      - "${JRUNMALL_REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - jrunmall_redis_data:/data

volumes:
  jrunmall_mysql_data:
  jrunmall_postgres_data:
  jrunmall_redis_data:








